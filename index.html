<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pigsrule.com - The Official Search Engine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px 20px 60px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7 0%, #f3d9ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #3a1226;
    }
    body.has-results { justify-content: flex-start; }
    header { text-align: center; margin-bottom: 24px; }
    .pig-icon { font-size: 72px; display: block; margin-bottom: 10px; }
    h1 { font-size: 48px; margin: 0; color: #b8296f; text-shadow: 2px 2px 0px #ffffff; }
    .subtitle { font-size: 16px; color: #6b244b; margin-top: 6px; font-weight: bold; }
    .search-container {
      width: 100%;
      max-width: 780px;
      background-color: #ffffff;
      padding: 22px;
      border-radius: 22px;
      border: 4px solid #cc7a9f;
      box-shadow: 0 10px 25px rgba(184, 41, 111, 0.2);
    }
    form.search-row { display: flex; gap: 10px; width: 100%; margin: 0; }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      font-size: 18px;
      font-family: inherit;
      border: 3px solid #decaff;
      border-radius: 14px;
      outline: none;
    }
    button[type="submit"] {
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      background-color: #c78dcc;
      color: #ffffff;
      border: 3px solid #923c99;
      border-radius: 14px;
      cursor: pointer;
    }
    button[type="submit"]:hover { background-color: #b8296f; border-color: #7a1848; }
     #resultsArea { width: 100%; max-width: 780px; margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
    .result-card { background-color: #ffffff; padding: 18px 22px; border-radius: 16px; border: 3px solid #decaff; box-shadow: 0 4px 12px rgba(184, 41, 111, 0.1); }
    .result-badge { display: inline-block; font-size: 11px; font-weight: bold; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; background: #f3d9ff; color: #6b244b; margin-bottom: 6px; }
    .result-url { font-size: 13px; color: #923c99; margin-bottom: 4px; word-break: break-all; }
    .result-title { font-size: 20px; font-weight: bold; color: #b8296f; text-decoration: none; display: inline-block; margin-bottom: 6px; }
    .result-title:hover { text-decoration: underline; }
    .result-snippet { font-size: 15px; color: #3a1226; line-height: 1.45; margin: 0; }
    .status-msg { text-align: center; font-size: 16px; font-weight: bold; color: #6b244b; padding: 20px; background: rgba(255, 255, 255, 0.85); border-radius: 16px; border: 2px solid #cc7a9f; }
    .web-btn { display: inline-block; margin-top: 12px; padding: 10px 18px; background-color: #b8296f; color: #ffffff; text-decoration: none; border-radius: 12px; font-weight: bold; }
     .theme-dice-btn {
      position: fixed !important;
      top: 16px !important;
      right: 16px !important;
      width: 78px;
      height: 78px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 9999;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.28));
    }
    .theme-dice-btn:hover { transform: scale(1.12); }
    @keyframes diceShake { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(-20deg) scale(1.15); } 50% { transform: rotate(20deg) scale(1.15); } 75% { transform: rotate(-15deg) scale(1.1); } }
    .dice-rolling { animation: diceShake 0.45s ease-in-out; }
    @keyframes barrelRoll { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .do-spin { animation: barrelRoll 1.2s ease-in-out; }
    @keyframes tardisPulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.15; transform: scale(0.92); } }
    body.tardis-mode { background: linear-gradient(135deg, #001f3f 0%, #003b6f 100%); color: #ffffff; }
    body.tardis-mode h1 { color: #7fdbff; text-shadow: 2px 2px 0px #001f3f; }
    body.tardis-mode .subtitle, body.tardis-mode footer { color: #bce8ff; }
    body.tardis-mode .pig-icon { animation: tardisPulse 1.4s infinite; }
    body.nox-mode { background: linear-gradient(135deg, #160c1f 0%, #2a1238 100%); color: #f5e6ff; }
    body.nox-mode h1 { color: #ff79c6; text-shadow: 2px 2px 0px #160c1f; }
    body.nox-mode .subtitle, body.nox-mode footer { color: #d8b4f8; }
    body.nox-mode .search-container, body.nox-mode .result-card, body.nox-mode .status-msg { background-color: #241433; color: #f5e6ff; border-color: #923c99; }
    body.nox-mode .result-snippet { color: #e9d5ff; }
    body.nox-mode input[type="text"] { background-color: #160c1f; color: #ffffff; border-color: #923c99; }
    body.lumos-mode { background: linear-gradient(135deg, #fffdf0 0%, #fff3b0 100%); }
    body.lumos-mode .search-container { box-shadow: 0 0 40px 12px rgba(255, 223, 70, 0.85); border-color: #f5b700; }
     body.forest-mode { background-color: #0f3d24; background-image: radial-gradient(circle at 80% 15%, rgba(255, 248, 175, 0.35) 0%, transparent 45%), radial-gradient(ellipse at 15% 100%, #1d6b3b 0%, transparent 55%), radial-gradient(ellipse at 85% 100%, #15572f 0%, transparent 60%), linear-gradient(180deg, #1b5e35 0%, #0d3b20 55%, #072413 100%); color: #e8ffe8; }
    body.forest-mode h1 { color: #9ef01a; text-shadow: 2px 3px 0px #062111; }
    body.forest-mode .subtitle, body.forest-mode footer { color: #c7f9cc; text-shadow: 1px 1px 2px #062111; }
    body.forest-mode .search-container { border-color: #52b788; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); }
    body.sunset-mode { background-color: #2b1055; background-image: radial-gradient(circle at 50% 62%, #fff3b0 0%, #ff9e00 14%, #ff5400 28%, transparent 55%), linear-gradient(180deg, #240046 0%, #7b2cbf 28%, #ff6d00 58%, #1d1e4e 62%, #0b132b 100%); color: #fff3e6; }
    body.sunset-mode h1 { color: #ffd166; text-shadow: 2px 3px 0px #3c096c; }
    body.sunset-mode .subtitle, body.sunset-mode footer { color: #ffe5d9; text-shadow: 1px 1px 3px #240046; }
    body.sunset-mode .search-container { border-color: #ff9e00; box-shadow: 0 10px 28px rgba(36, 0, 70, 0.55); }
    .egg-banner { background: linear-gradient(90deg, #ff69b4, #9b51e0); color: #ffffff; font-weight: bold; text-align: center; padding: 14px 20px; border-radius: 16px; border: 3px solid #ffffff; box-shadow: 0 6px 18px rgba(184, 41, 111, 0.35); font-size: 17px; }
    @keyframes pigFall { 0% { transform: translateY(-60px) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(360deg); opacity: 0.9; } }
    .falling-pig { position: fixed; top: -50px; font-size: 34px; pointer-events: none; z-index: 9999; animation: pigFall linear forwards; }
  </style>
</head>
<body>
  <button type="button" id="themeDiceBtn" class="theme-dice-btn" onclick="rollThemeDice()" title="Roll Theme Dice">
    <span id="diceFace">🎲</span>
  </button>
  <header>
    <span class="pig-icon">🐷</span>
    <h1 translate="no"><span>P</span><span>i</span><span>g</span><span>s</span><span>r</span><span>u</span><span>l</span><span>e</span><span>.</span><span>c</span><span>o</span><span>m</span></h1>
    <div class="subtitle">Search Doctor Who, Poki, D&amp;D, Animals, Comics, Books, Harry Potter, Maps, Creative Apps &amp; More!</div>
  </header>
  <main class="search-container">
    <form class="search-row" action="javascript:void(0);" onsubmit="return runSearch(event);">
      <input type="text" id="searchInput" placeholder="Search anything on Pigsrule.com..." autofocus required />
      <button type="submit">🔍 Search</button>
    </form>
  </main>
  <section id="resultsArea"></section>
  <footer>Powered by Pigsrule.com &bull; Built for Creators, Readers &amp; Gamers</footer>
  <script>
    const pigDatabase = [
      { category: "Doctor Who", title: "Doctor Who Official Website", url: "https://doctorwho.tv", tags: "dr who doctor who drwho official site website tardis dalek cybermen bbc sci fi", snippet: "Official home of Doctor Who! Episodes, Doctors, companions, and monsters." },
      { category: "Doctor Who", title: "TARDIS Wiki", url: "https://tardis.wiki", tags: "dr who doctor who drwho tardis wiki lore dalek gallifrey", snippet: "Massive encyclopedia covering every Doctor Who episode, character, and alien." },
      { category: "Doctor Who", title: "Big Finish Doctor Who Audio", url: "https://bigfinish.com", tags: "dr who doctor who audio stories big finish", snippet: "Full-cast Doctor Who audio adventures starring the original Doctors." },
      { category: "Poki", title: "Poki - Free Online Games", url: "https://poki.com", tags: "poki video games play online browser games free", snippet: "Play thousands of free online games instantly in your browser on Poki." },
      { category: "Poki", title: "CrazyGames", url: "https://crazygames.com", tags: "poki crazygames browser games play online free", snippet: "Play free online browser games across action, puzzle, and adventure." },
      { category: "D&D", title: "D&D Beyond", url: "https://dndbeyond.com", tags: "d and d dandd d&d dnd dungeons and dragons character builder spells", snippet: "Official digital toolset and character builder for Dungeons & Dragons." },
      { category: "D&D", title: "Roll20 Virtual Tabletop", url: "https://roll20.net", tags: "d and d dandd d&d dnd dungeons and dragons tabletop maps", snippet: "Play Dungeons & Dragons online with digital battle maps and dice rollers." },
      { catagory: "???", title: "The Traitors: AI edition", url: "https://charlieblarsen-cloud.github.io/Traitors.sim/", tags: "traitors ai game castle murder mystery simulation pigsrule", snippet: "Watch 5 AIs argue, lie, and banish each other in a castle showdown." },
      { category: "All Animals", title: "National Geographic Animals", url: "https://nationalgeographic.com", tags: "all animals wildlife mammals birds reptiles ocean sharks pigs capybara", snippet: "Facts, photos, and habitats for every animal species on Earth." },
      { category: "All Animals", title: "San Diego Zoo Animals", url: "https://sandiegozoo.org", tags: "all animals zoo wildlife mammals amphibians insects", snippet: "Huge encyclopedia of animals organized by species, habitat, and diet." },
      { category: "All Animals", title: "Capybara Legends Lore", url: "#capybara-legends", tags: "all animals capybara legends goorglefellae spiderbara cookabaras tazz xame poshos", snippet: "The mythic saga of Goorglefellae, Spiderbara, the disco-loving Cookabaras, and Tazz Xame!" },
      { category: "Comics", title: "Marvel Comics", url: "https://marvel.com", tags: "comics superheroes spider-man avengers x-men graphic novels", snippet: "Explore Marvel Comics characters, series, and graphic novels." },
      { category: "Comics", title: "DC Comics", url: "https://dc.com", tags: "comics batman superman wonder woman graphic novels", snippet: "Discover DC Comics, graphic novels, and superhero universes." },
      { category: "Comics", title: "WEBTOON Comics", url: "https://webtoons.com", tags: "comics webtoon manga graphic novels fantasy sci fi", snippet: "Read thousands of free creator-owned comics and manga online." },
      { category: "Books", title: "Goodreads", url: "https://goodreads.com", tags: "books reading novels reviews fantasy sci fi goodreads", snippet: "Find your next favourite book, read reviews, and track your reading." },
      { category: "Books", title: "Waterstones Books", url: "https://waterstones.com", tags: "books bookshop reading fiction fantasy waterstones", snippet: "Browse millions of books across fantasy, sci-fi, and adventure." },
      { category: "Books", title: "Open Library", url: "https://openlibrary.org", tags: "books free library read online novels open library", snippet: "Digital library with millions of free books you can read online." },
      { category: "Harry Potter", title: "Harry Potter Official", url: "https://harrypotter.com", tags: "harry potter harrypotter hogwarts wizarding world magic gryffindor slytherin", snippet: "Official home of Harry Potter and the Wizarding World." },
      { category: "Harry Potter", title: "Harry Potter Wiki", url: "https://fandom.com", tags: "harry potter harrypotter wiki hogwarts spells characters potions", snippet: "Encyclopedia covering every spell, potion, and character in Harry Potter." },
      { category: "Movies & TV Shows", title: "IMDb Movies & TV", url: "https://imdb.com", tags: "movies tv shows tvshows series actors trailers ratings", snippet: "Movie and TV show ratings, trailers, cast lists, and trivia." },
      { category: "Movies & TV Shows", title: "Rotten Tomatoes", url: "https://rottentomatoes.com", tags: "movies tv shows tvshows reviews ratings cinema", snippet: "Check critic and audience scores for movies and TV series." },
      { category: "School Subjects", title: "BBC Bitesize", url: "https://bbc.co.uk", tags: "all school subjects maths english science history geography computing revision", snippet: "Free study guides and quizzes for every school subject." },
      { category: "School Subjects", title: "Khan Academy", url: "https://khanacademy.org", tags: "all school subjects math science computing history grammar", snippet: "Free lessons and practice in maths, science, computing, and history." },
      { category: "Custom Maps", title: "Fantasy Town Generator", url: "https://fantasytowngenerator.com", tags: "making custom maps fantasy town generator interactive characters factions buildings dnd", snippet: "Interactive fantasy settlement and map builder where you can customise towns, buildings, characters, and factions." },
      { category: "Custom Maps", title: "Inkarnate Map Maker", url: "https://inkarnate.com", tags: "making custom maps fantasy worldbuilding map maker dnd", snippet: "Create custom fantasy world maps, continents, and battle maps." },
      { category: "Creative Apps", title: "Adobe Creative Cloud", url: "https://adobe.com", tags: "creativity creative apps adobe photoshop illustrator premiere design", snippet: "Adobe apps for photo editing, illustration, video, and animation." },
      { category: "Creative Apps", title: "Photopea Editor", url: "https://photopea.com", tags: "creativity creative apps adobe photoshop alternative free editor", snippet: "Free browser-based photo editor that works like Adobe Photoshop." },
      { category: "Creative Apps", title: "Canva Design Studio", url: "https://canva.com", tags: "creativity creative apps design posters book covers logos free", snippet: "Design book covers, posters, logos, and comics for free." },
      { category: "Video Games", title: "Minecraft Official Site", url: "https://minecraft.net", tags: "video games minecraft blocks survival creative mojang", snippet: "Explore infinite worlds and build anything you can imagine in Minecraft." },
      { category: "Video Games", title: "Roblox", url: "https://roblox.com", tags: "video games roblox play create multiplayer games", snippet: "Play millions of community-made games or build your own in Roblox Studio." },
      { category: "Space & NASA", title: "NASA Space Exploration", url: "https://nasa.gov", tags: "space nasa planets stars galaxies rockets astronomy", snippet: "Explore planets, black holes, Mars rovers, and space missions." },
      { category: "Coding", title: "Scratch Game Creator", url: "https://mit.edu", tags: "coding programming game dev scratch animations creative", snippet: "Code your own interactive games, stories, and animations." },
      { category: "Music", title: "BandLab Music Studio", url: "https://bandlab.com", tags: "music audio beats sound effects songs creative", snippet: "Make music and create soundtracks online for free." },
      { category: "History", title: "Horrible Histories (CBBC)", url: "https://bbc.co.uk", tags: "history funny songs quizzes romans vikings tudors", snippet: "Hilarious history sketches, songs, and quizzes from the Stone Age to modern times." },
      { category: "Cooking", title: "BBC Good Food", url: "https://bbcgoodfood.com", tags: "cooking recipes baking cakes snacks", snippet: "Thousands of easy recipes for baking, snacks, and meals." }
    ];

 let currentDiceRoll = 1;

    function getSmoothDiceSVG(num) {
      const pips = {
        1: '<circle cx="50" cy="50" r="10" fill="#b8296f"/>',
        2: '<circle cx="30" cy="30" r="9" fill="#b8296f"/><circle cx="70" cy="70" r="9" fill="#b8296f"/>',
        3: '<circle cx="28" cy="28" r="8.5" fill="#b8296f"/><circle cx="50" cy="50" r="8.5" fill="#b8296f"/><circle cx="72" cy="72" r="8.5" fill="#b8296f"/>',
        4: '<circle cx="30" cy="30" r="9" fill="#b8296f"/><circle cx="70" cy="30" r="9" fill="#b8296f"/><circle cx="30" cy="70" r="9" fill="#b8296f"/><circle cx="70" cy="70" r="9" fill="#b8296f"/>',
        5: '<circle cx="28" cy="28" r="8.5" fill="#b8296f"/><circle cx="72" cy="28" r="8.5" fill="#b8296f"/><circle cx="50" cy="50" r="8.5" fill="#b8296f"/><circle cx="28" cy="72" r="8.5" fill="#b8296f"/><circle cx="72" cy="72" r="8.5" fill="#b8296f"/>',
        6: '<circle cx="30" cy="25" r="8" fill="#b8296f"/><circle cx="70" cy="25" r="8" fill="#b8296f"/><circle cx="30" cy="50" r="8" fill="#b8296f"/><circle cx="70" cy="50" r="8" fill="#b8296f"/><circle cx="30" cy="75" r="8" fill="#b8296f"/><circle cx="70" cy="75" r="8" fill="#b8296f"/>'
      };
      return '<svg viewBox="0 0 100 100" width="76" height="76" style="width:76px;height:76px;display:block;" xmlns="http://w3.org">' +
             '<defs><linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">' +
             '<stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f3d9ff"/>' +
             '</linearGradient></defs>' +
             '<rect x="6" y="6" width="88" height="88" rx="22" fill="url(#diceGrad)" stroke="#cc7a9f" stroke-width="5"/>' +
             pips[num] + '</svg>';
    }

    function rollThemeDice() {
      const btn = document.getElementById('themeDiceBtn');
      const face = document.getElementById('diceFace');
      let roll = Math.floor(Math.random() * 6) + 1;
      while (roll === currentDiceRoll) { roll = Math.floor(Math.random() * 6) + 1; }
      currentDiceRoll = roll;

      btn.classList.remove('dice-rolling');
      void btn.offsetWidth;
      btn.classList.add('dice-rolling');

      document.body.classList.remove('nox-mode', 'tardis-mode', 'lumos-mode', 'forest-mode', 'sunset-mode');
      const themeNames = ['1: Classic Pink', '2: Nox Dark', '3: TARDIS Blue', '4: Lumos Glow', '5: Capybara Jungle', '6: Sunset Gold'];
      face.innerHTML = getSmoothDiceSVG(roll);
      btn.title = themeNames[roll - 1];

      if (roll === 2) { document.body.classList.add('nox-mode'); }
      else if (roll === 3) { document.body.classList.add('tardis-mode'); }
      else if (roll === 4) { document.body.classList.add('lumos-mode'); }
      else if (roll === 5) { document.body.classList.add('forest-mode'); }
      else if (roll === 6) { document.body.classList.add('sunset-mode'); }
    }    
    function triggerPigRain() {
      for (let i = 0; i < 28; i++) {
        const pig = document.createElement('div');
        pig.className = 'falling-pig';
        pig.textContent = '🐷';
        pig.style.left = Math.random() * 96 + 'vw';
        pig.style.animationDuration = (2 + Math.random() * 2.5) + 's';
        pig.style.animationDelay = (Math.random() * 0.8) + 's';
        document.body.appendChild(pig);
        setTimeout(function() { pig.remove(); }, 5500);
        document.getElementById('diceFace').innerHTML = getSmoothDiceSVG(1);
      }
    }

    function runSearch(event) {
      if (event) event.preventDefault();
      const rawQuery = document.getElementById('searchInput').value.trim();
      const lowerQuery = rawQuery.toLowerCase();
      const words = lowerQuery.split(/\s+/);
      const resultsArea = document.getElementById('resultsArea');
      if (!rawQuery) return false;
      document.body.classList.add('has-results');
      let eggHtml = '';
      if (lowerQuery.indexOf('barrel roll') !== -1 || lowerQuery === 'spin') {
        const box = document.querySelector('.search-container');
        box.classList.remove('do-spin'); void box.offsetWidth; box.classList.add('do-spin');
        eggHtml += '<div class="egg-banner">🌀 Wheeeee! Pigsrule.com did a barrel roll!</div>';
      }
      if (lowerQuery.indexOf('pig rain') !== -1 || lowerQuery === 'oink') {
        triggerPigRain();
        eggHtml += '<div class="egg-banner">🐷 OINK OINK! Incoming Pig Rain!</div>';
      }
      if (lowerQuery.indexOf('tardis') !== -1 || lowerQuery.indexOf('exterminate') !== -1) {
        document.body.classList.remove('nox-mode', 'lumos-mode', 'forest-mode', 'sunset-mode');
        document.body.classList.add('tardis-mode');
        eggHtml += '<div class="egg-banner">🛸 VWORP VWORP! TARDIS Time-Vortex Mode Activated!</div>';
      }
      if (lowerQuery === 'lumos') {
        document.body.classList.remove('nox-mode', 'tardis-mode', 'forest-mode', 'sunset-mode');
        document.body.classList.add('lumos-mode');
        eggHtml += '<div class="egg-banner">🪄 LUMOS! Maximum wand brightness activated!</div>';
      }
      if (lowerQuery === 'nox') {
        document.body.classList.remove('lumos-mode', 'tardis-mode', 'forest-mode', 'sunset-mode');
        document.body.classList.add('nox-mode');
        eggHtml += '<div class="egg-banner">🌙 NOX! Dark Mode activated!</div>';
      }
      if (lowerQuery === 'default' || lowerQuery === 'reset' || lowerQuery === 'normal') {
        document.body.classList.remove('nox-mode', 'lumos-mode', 'tardis-mode', 'forest-mode', 'sunset-mode');
        eggHtml += '<div class="egg-banner">🐷 Classic Pink & Purple Theme Restored!</div>';
      }
      if (lowerQuery.indexOf('roll d20') !== -1 || lowerQuery.indexOf('nat 20') !== -1) {
        const roll = Math.floor(Math.random() * 20) + 1;
        if (roll === 20) { triggerPigRain(); eggHtml += '<div class="egg-banner">🎲 You rolled a 20! CRITICAL HIT! Pigs Rule Forever!</div>'; }
        else if (roll === 1) { eggHtml += '<div class="egg-banner">🎲 You rolled a 1... Critical Fail! Tazz Xame stole your dice!</div>'; }
        else { eggHtml += '<div class="egg-banner">🎲 You rolled a ' + roll + ' on the D20!</div>'; }
      }
      const matches = pigDatabase.filter(function(item) {
        const fullText = (item.category + ' ' + item.title + ' ' + item.tags + ' ' + item.snippet).toLowerCase();
        return words.every(function(word) { return fullText.indexOf(word) !== -1; });
      });
      let html = eggHtml;
      if (matches.length > 0) {
        matches.forEach(function(item) {
          html += '<div class="result-card"><span class="result-badge">' + item.category + '</span><div class="result-url">' + item.url + '</div><a class="result-title" href="' + item.url + '">' + item.title + '</a><p class="result-snippet">' + item.snippet + '</p></div>';
        });
      } else if (!eggHtml) {
        html = '<div class="status-msg">🐷 No built-in cards matched "<strong>' + rawQuery + '</strong>" yet!<br/><a class="web-btn" href="https://google.com' + encodeURIComponent(rawQuery) + '">Search the Full Web for "' + rawQuery + '" &rarr;</a></div>';
      }
      resultsArea.innerHTML = html;
      return false;
    }
  </script>
</body>
</html>
