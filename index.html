function runSearch() {
const rawQuery = document.getElementById('searchInput').value.trim();
const words = rawQuery.toLowerCase().split(/\s+/);
const resultsArea = document.getElementById('resultsArea');
if (!rawQuery) return;
document.body.classList.add('has-results');
const matches = pigDatabase.filter(item => {
const fullText = (item.category + ' ' + item.title + ' ' + item.tags + ' ' + item.snippet).toLowerCase();
return words.every(word => fullText.includes(word));
});
let html = '';
if (matches.length > 0) {
matches.forEach(item => {
html += `

${item.category}
${item.url}
${item.title}
${item.snippet}
; }); } else { html += 

🐷 No built-in Pigsrule.com cards matched "${rawQuery}" yet!
Search the Full Web for "${rawQuery}" →

`;
}
resultsArea.innerHTML = html;
