<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pigsrule.com - The Official Search Engine</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7 0%, #f3d9ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #3a1226;
    }
    header { text-align: center; margin-bottom: 24px; }
    .pig-icon { font-size: 72px; display: block; margin-bottom: 10px; }
    h1 { font-size: 48px; margin: 0; color: #b8296f; text-shadow: 2px 2px 0px #ffffff; }
    .subtitle { font-size: 16px; color: #6b244b; margin-top: 6px; font-weight: bold; }
    .search-container {
      width: 100%;
      max-width: 720px;
      background-color: #ffffff;
      padding: 22px;
      border-radius: 22px;
      border: 4px solid #cc7a9f;
      box-shadow: 0 10px 25px rgba(184, 41, 111, 0.2);
    }
    form { display: flex; gap: 10px; width: 100%; }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      font-size: 18px;
      font-family: inherit;
      border: 3px solid #decaff;
      border-radius: 14px;
      outline: none;
    }
    button {
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      background-color: #c78dcc;
      color: #ffffff;
      border: 3px solid #923c99;
      border-radius: 14px;
      cursor: pointer;
    }
    footer { position: fixed; bottom: 15px; font-size: 14px; color: #6b244b; }
  </style>
</head>
<body>

  <header>
    <span class="pig-icon">🐷</span>
    <h1 translate="no"><span>P</span><span>i</span><span>g</span><span>s</span><span>r</span><span>u</span><span>l</span><span>e</span><span>.</span><span>c</span><span>o</span><span>m</span></h1>
    <div class="subtitle">Searching the Whole Web &bull; Built on Pigsrule.com</div>
  </header>

  <main class="search-container">
    <form action="https://google.com" method="GET">
      <input type="text" name="q" placeholder="Search the entire web..." autofocus required />
      <button type="submit">🔍 Search</button>
    </form>
  </main>

  <footer>
    Powered by Pigsrule.com &bull; Made for fans of Doctor Who, Games &amp; Books
  </footer>

</body>
</html>
