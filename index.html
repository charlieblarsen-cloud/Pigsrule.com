<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pigsrule.com - The Official Search Engine</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px 60px;
      font-family: "Trebuchet MS", Arial, sans-serif;
      background: linear-gradient(135deg, #ffd6e7 0%, #f3d9ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #3a1226;
      transition: all 0.3s ease;
    }

    body.has-results {
      justify-content: flex-start;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    .pig-icon {
      font-size: 72px;
      display: block;
      margin-bottom: 10px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-size: 48px;
      margin: 0;
      color: #b8296f;
      text-shadow: 2px 2px 0px #ffffff;
    }

    .subtitle {
      font-size: 16px;
      color: #6b244b;
      margin-top: 6px;
      font-weight: bold;
    }

    .search-container {
      width: 100%;
      max-width: 760px;
      background-color: #ffffff;
      padding: 22px;
      border-radius: 22px;
      border: 4px solid #cc7a9f;
      box-shadow: 0 10px 25px rgba(184, 41, 111, 0.2);
    }

    .search-box {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      font-size: 18px;
      font-family: inherit;
      border: 3px solid #decaff;
      border-radius: 14px;
      outline: none;
      color: #3a1226;
      background-color: #fffafd;
    }

    input[type="text"]:focus {
      border-color: #b8296f;
    }

    button.search-btn {
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
      font-family: inherit;
      background-color: #c78dcc;
      color: #ffffff;
      border: 3px solid #923c99;
      border-radius: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.search-btn:hover {
      background-color: #b8296f;
      border-color: #7a1848;
    }

    #resultsArea {
      width: 100%;
      max-width: 760px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .result-card {
      background-color: #ffffff;
      padding: 18px 22px;
      border-radius: 16px;
      border: 3px solid #decaff;
      box-shadow: 0 4px 12px rgba(184, 41, 111, 0.1);
      transition: transform 0.15s, border-color 0.15s;
    }

    .result-card:hover {
      transform: translateY(-2px);
      border-color: #cc7a9f;
    }

    .result-url {
      font-size: 13px;
      color: #923c99;
      margin-bottom: 4px;
      word-break: break-all;
    }

    .result-title {
      font-size: 20px;
      font-weight: bold;
      color: #b8296f;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 6px;
    }

    .result-title:hover {
      text-decoration: underline;
    }

    .result-snippet {
      font-size: 15px;
      color: #3a1226;
      line-height: 1.45;
      margin: 0;
    }

    .status-msg {
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #6b244b;
      padding: 20px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 16px;
    }

    footer {
      margin-top: auto;
      padding-top: 30px;
      font-size: 14px;
      color: #6b244b;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <span class="pig-icon">🐷</span>
    <h1 translate="no"><span>P</span><span>i</span><span>g</span><span>s</span><span>r</span><span>u</span><span>l</span><span>e</span><span>.</span><span>c</span><span>o</span><span>m</span></h1>
    <div class="subtitle">Searching the Whole Web &bull; Built on Pigsrule.com</div>
  </header>

  <main class="search-container">
    <form class="search-box" onsubmit="runSearch(event)">
      <input type="text" id="searchInput" placeholder="Search the entire web..." autofocus required />
      <button type="submit" class="search-btn">🔍 Search</button>
    </form>
  </main>

  <section id="resultsArea"></section>

  <footer>
    Powered by Pigsrule.com &bull; Made for fans of Doctor Who, Games &amp; Books
  </footer>

  <script>
    async function runSearch(event) {
      event.preventDefault();
      const query = document.getElementById('searchInput').value.trim();
      const resultsArea = document.getElementById('resultsArea');
      if (!query) return;

      document.body.classList.add('has-results');
      resultsArea.innerHTML = '<div class="status-msg">🐷 Sniffing out results across the web...</div>';

      try {
        // Fetch live web & knowledge results from Wikipedia + DuckDuckGo APIs
        const [wikiRes, ddgRes] = await Promise.all([
          fetch(`https://wikipedia.org{encodeURIComponent(query)}&utf8=&format=json&origin=*`),
          fetch(`https://duckduckgo.com{encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`)
        ]);

        const wikiData = await wikiRes.json();
        const ddgData = await ddgRes.json();

        let cardsHTML = '';

        // 1. Add DuckDuckGo Direct Answer / Official Site if found
        if (ddgData.AbstractText && ddgData.AbstractURL) {
          cardsHTML += `
            <div class="result-card">
              <div class="result-url">${ddgData.AbstractURL}</div>
              <a class="result-title" href="${ddgData.AbstractURL}" target="_blank" rel="noopener">${ddgData.Heading || query}</a>
              <p class="result-snippet">${ddgData.AbstractText}</p>
            </div>
          `;
        }

        // 2. Add DuckDuckGo Related Web Links
        if (ddgData.RelatedTopics && ddgData.RelatedTopics.length > 0) {
          ddgData.RelatedTopics.slice(0, 4).forEach(topic => {
            if (topic.FirstURL && topic.Text) {
              const title = topic.Text.split(' - ')[0] || query;
              cardsHTML += `
                <div class="result-card">
                  <div class="result-url">${topic.FirstURL}</div>
                  <a class="result-title" href="${topic.FirstURL}" target="_blank" rel="noopener">${title}</a>
                  <p class="result-snippet">${topic.Text}</p>
                </div>
              `;
            }
          });
        }

        // 3. Add Full Web Topic Articles
        if (wikiData.query && wikiData.query.search.length > 0) {
          wikiData.query.search.forEach(item => {
            const pageUrl = `https://wikipedia.org{encodeURIComponent(item.title.replace(/ /g, '_'))}`;
            const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, "");
            cardsHTML += `
              <div class="result-card">
                <div class="result-url">${pageUrl}</div>
                <a class="result-title" href="${pageUrl}" target="_blank" rel="noopener">${item.title}</a>
                <p class="result-snippet">${cleanSnippet}...</p>
              </div>
            `;
          });
        }

        if (!cardsHTML) {
          resultsArea.innerHTML = `<div class="status-msg">No direct matches found on Pigsrule.com for "${query}". Try a different keyword!</div>`;
        } else {
          resultsArea.innerHTML = cardsHTML;
        }
      } catch (err) {
        resultsArea.innerHTML = `<div class="status-msg">Oops! Could not fetch results right now. Check your connection and try again.</div>`;
      }
    }
  </script>

</body>
</html>
