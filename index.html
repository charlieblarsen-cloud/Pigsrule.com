    function runSearch(event) {
      if (event) event.preventDefault();
      const rawQuery = document.getElementById('searchInput').value.trim();
      const words = rawQuery.toLowerCase().split(/\s+/);
      const resultsArea = document.getElementById('resultsArea');
      if (!rawQuery) return false;

      document.body.classList.add('has-results');

      const matches = pigDatabase.filter(function(item) {
        const fullText = (item.category + ' ' + item.title + ' ' + item.tags + ' ' + item.snippet).toLowerCase();
        return words.every(function(word) { return fullText.indexOf(word) !== -1; });
      });

      let html = '';
      if (matches.length > 0) {
        matches.forEach(function(item) {
          html += '<div class="result-card">' +
                    '<span class="result-badge">' + item.category + '</span>' +
                    '<div class="result-url">' + item.url + '</div>' +
                    '<a class="result-title" href="' + item.url + '">' + item.title + '</a>' +
                    '<p class="result-snippet">' + item.snippet + '</p>' +
                  '</div>';
        });
      } else {
        html = '<div class="status-msg">' +
                 '🐷 No built-in cards matched "<strong>' + rawQuery + '</strong>" yet!<br/>' +
                 '<a class="web-btn" href="https://google.com' + encodeURIComponent(rawQuery) + '">Search the Full Web for "' + rawQuery + '" &rarr;</a>' +
               '</div>';
      }
      resultsArea.innerHTML = html;
      return false;
    }
